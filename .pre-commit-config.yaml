# Secret-scanning pre-commit for the agent-src repo.
# Mirrors the ~/.hermes gitleaks wiring (SR-001) and the jobflow-dashboard repo:
# same pinned rev and the same shared laptop ruleset, so allowlists stay in one
# place. Install the hook with `pre-commit install` after cloning (the generated
# .git/hooks/pre-commit is not tracked; this file is). gitleaks 8.30 uses `git`,
# not the deprecated `protect`.
#
# The ruleset is reached through gitleaks' own GITLEAKS_CONFIG env var (its
# precedence: --config, GITLEAKS_CONFIG, GITLEAKS_CONFIG_TOML, <repo>/.gitleaks.toml,
# then the built-in defaults), NOT a --config= arg: until 2026-09-17 this file
# carried --config=C:/Users/diego/.config/gitleaks/gitleaks.toml, which no other
# user profile or machine can resolve, and pre-commit never expands env vars or
# ~ in args. On this box it is a User environment variable pointing at
# ~/.config/gitleaks/gitleaks.toml (the XDG default); a host without it scans
# with gitleaks' stock rules, which is strictly noisier -- the shared file only
# ADDS allowlists on top of the defaults, so a missing config can never hide a
# secret, only flag a known-safe fixture. A GITLEAKS_CONFIG that names a missing
# file refuses the commit: gitleaks 8.30.1 exits 1 on `FTL unable to load
# gitleaks config`, the SAME code as "leaks found", and pre-commit fails on any
# non-zero -- so the refusal holds here, but only because the hook never has to
# tell the two apart. scanner.py (SR-001 component 1) resolves the ruleset with
# the same GITLEAKS_CONFIG precedence since 2026-09-18 (scanner commit 0a3e03e),
# passes it explicitly as --config= with no stock-rules fallback, and had to
# learn that exit 1 without a report is the fatal, not a clean scan.
# tests/test_upgrade_hook_closure.py resolves the ruleset the same way.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ruff lint gate (Pyflakes "F" group + PLW1514).
  #
  # The rule set lives in ruff.toml at the repo root -- NOT pyproject.toml --
  # so this hook and the blocking CI job (.github/workflows/lint.yml, which
  # runs a bare `ruff check .`) stay in sync automatically. Adding a rule
  # there arms it in both places at once.
  #
  # This restores enforcement that landed in May 2026 and fell out of main in
  # the v0.15.1 cutover. The F group is enforced tree-wide with NO
  # suppressions -- the re-land sunset list was burned to zero and deleted
  # (2026-08-17). ruff.toml's per-file-ignores now holds only PLW1514
  # exemptions for tests/, skills/, optional-skills/ and plugins/.
  #
  # Deliberately NO --fix: a pre-commit hook that rewrites source during a
  # commit hides the change from the diff the author is reviewing, and the
  # F841 autofix in particular can delete side-effecting statements.
  #
  # The RULES stay in sync via ruff.toml. The ruff BINARY version is declared
  # in FOUR files, all on 0.15.12 as of 2026-08-17:
  #   1. this hook's `rev:` below (pre-commit's own isolated env)
  #   2. both lint.yml jobs -- `uv tool install ruff==0.15.12`
  #   3. ruff.toml `required-version`
  #   4. pyproject.toml's dev extra, which is what the repo .venv installs
  # tests/test_lint_config.py::TestRuffVersionPins asserts all four agree, so
  # bumping any one alone fails the suite -- and an UNPINNED `uv tool install
  # ruff` fails it too rather than passing unnoticed.
  #
  # (3) is the one that reaches the binaries no test can see: ruff refuses to
  # load this config under a version it does not match and exits 2 (verified
  # 2026-08-17 -- 0.15.10 and 0.16.3 both fail with "Required version
  # `==0.15.12` does not match"). That covers whatever ruff is on PATH, which
  # is what events/producers/ruff_gate_probe.py shells out to every 15 minutes;
  # before it, the alarm's version depended on whether a session happened to
  # have the .venv activated. The probe reads exit >= 2 as UNMEASURABLE rather
  # than clean, so a mismatch there surfaces as a broken alarm instead of a
  # silent pass. A bump is a four-file change or it is a drift.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12 # the ruff pre-commit runs -- see the version note above
    hooks:
      - id: ruff-check
        name: ruff (Pyflakes F group + PLW1514)

  # EventType / sibling-lookup-table drift guard.
  #
  # Adding a member to events/schema.py EventType requires a paired entry in
  # every table contracted to be total over the enum (EVENT_TYPE_EMOJI,
  # routing_policy._POLICY). That pairing has broken four times on record
  # (2026-04-27 x2, 2026-05-29, 2026-08-11) and ruff structurally cannot catch
  # it -- the keys are attribute accesses, which F601/F602 do not reach.
  #
  # This runs at ADD time, which the coverage tests do not: they only fail on a
  # later `pytest tests/events/` that nobody ran at the four recurrences. It is
  # a read-only import + dict comparison, no I/O, well under a second warm.
  # See events/coverage.py for what it checks and why an import-time assertion
  # in the gateway would be the wrong trade.
  #
  # This hook is still bypassable (`--no-verify`, or a checkout where pre-commit
  # was never installed), so it is backstopped -- not replaced -- by a non-fatal
  # runtime signal: each required-total table calls
  # events.coverage.log_missing_members() at the bottom of its own module and a
  # running gateway logs ONE error naming every member with no entry.
  - repo: local
    hooks:
      - id: event-type-coverage
        name: EventType lookup-table coverage
        entry: python -m events.coverage
        language: system
        pass_filenames: false
        files: ^events/.*\.py$
      # 2026-08-23: .superpowers/ is SDD agent scratch and must never reach a
      # commit. Ported from ~/.hermes (45c2d4a4a) after root-causing how it got
      # committed there on 2026-08-22 -- two independent causes, which is why
      # this is a HOOK and not a wording rule:
      #   - one implementer was ORDERED to commit its report by a dispatch that
      #     said "Commit all scoped product/test changes plus report"; the report
      #     lives at an ignored path, so `git add -f` was the only way to obey.
      #   - another was correctly told "Commit product changes only" and force-
      #     added anyway, after a plain add was refused and git's own "hint: Use
      #     -f if you really want to add them" supplied the override.
      # An ignore rule cannot stop an explicit -f. THIS REPO HAS ALREADY LOST
      # THIS RACE ONCE: the 2026-08-10 untrack here was undone by a `git add`
      # five minutes later (a4f9b110b), because agent-src relied on a per-dir
      # .gitignore that was missing in some worktrees. The rule is sound now
      # (.git/info/exclude:45), but soundness was never the failing part.
      #
      # DELETIONS ARE DELIBERATELY STILL ALLOWED -- pre-commit passes only
      # added/copied/modified paths, so `git rm --cached` untracking commits
      # pass. That is load-bearing: it is how a re-tracked file gets removed.
      # Escape hatch is the NAMED skip, never --no-verify:
      #   SKIP=no-sdd-scratch git commit ...
      # Windows-footgun checker, on staged files only.
      #
      # lint.yml runs `check-windows-footguns.py --all` as a BLOCKING job, but
      # the hook set did not run it at all, so a commit that trips that gate
      # lands clean locally and fails minutes later in CI. That is exactly how
      # c21ddb166f got in. Local and CI now refuse the same commit.
      #
      # With no --all flag the checker scans the paths pre-commit hands it, so
      # this costs a handful of files, not the 1932-file tree scan.
      #
      # SCOPE MATCHES THE CI GATE ON PURPOSE, and it now covers everything.
      # This hook carried `exclude: ^(tests|evals)/` to track the same
      # deferral `--all` had (a measured 2996-finding backlog); a hook that
      # blocked on findings no CI job rejects would train people to reach for
      # --no-verify. The backlog reached zero on 2026-09-15 and
      # ALL_SCAN_SKIP_TOP_LEVEL is now empty and pinned empty, so the exclude
      # is gone with it. If one ever comes back, both must move together.
      - id: windows-footguns
        name: Windows footguns (staged files)
        entry: python scripts/check-windows-footguns.py
        language: system
        files: \.(py|pyw|pyi)$
      - id: no-sdd-scratch
        name: block .superpowers scratch from being committed
        language: fail
        entry: >-
          .superpowers/ is SDD agent scratch and must never be committed.
          Report files are handed back as a PATH, not committed. If a brief
          told you to commit one, the brief is wrong. To untrack an existing
          one use `git rm --cached` (deletions are allowed). Deliberate
          override: SKIP=no-sdd-scratch — never --no-verify.
        files: ^\.superpowers/
