# ruff configuration for the Hermes agent fork.
#
# This file deliberately lives OUTSIDE pyproject.toml.  ruff reads ruff.toml in
# preference to pyproject.toml's [tool.ruff] and ignores the latter SILENTLY --
# no warning, no error -- so pyproject.toml must carry no [tool.ruff] table at
# all.  tests/test_lint_config.py asserts that, and asserts the select below.
#
# The split was originally made to keep the per-file-ignores sunset list -- 544
# entries at its peak -- out of pyproject.toml, which also holds dependencies,
# pytest markers and build config.  That list is now GONE (stage 6, 2026-08-17),
# so the file is small; it stays separate because moving the config back would
# re-create the silent-shadowing hazard above for no gain.
#
# Design: docs/superpowers/specs/2026-08-16-ruff-f-group-reland-design.md

preview = true  # required for PLW1514 (unspecified-encoding) -- preview rule

# The ONE place the ruff binary version is declared. ruff enforces this itself:
# a binary whose version does not match refuses to load this config and exits 2,
# so every caller is pinned by the file they already share -- the pre-commit
# hook, both lint.yml jobs, the repo .venv, and the 15-minute whole-tree alarm
# in events/producers/ruff_gate_probe.py.
#
# This exists because the equality used to be maintained BY HAND across four
# declaration sites with nothing asserting it, and it had already drifted: on
# 2026-08-17 the hook, CI and the PATH CLI were aligned on 0.15.12 while
# pyproject.toml's dev extra still said 0.15.10 -- and the repo .venv, installed
# FROM that extra, was really running 0.15.10. The alarm resolves ruff off PATH,
# so which version it linted with depended on whether a session had the venv
# activated. Two gates disagreeing about the same tree is precisely the failure
# the whole-tree probe exists to prevent, one level down.
#
# Bumping ruff means changing this line, pyproject.toml's dev extra, the
# ruff-pre-commit `rev:`, and both `uv tool install` lines in lint.yml together
# -- tests/test_lint_config.py::TestRuffVersionPins fails until they agree.
required-version = "==0.15.12"

[lint]
# Pyflakes "F" group, enforced project-wide (CI blocking job + pre-commit hook).
#
# F601 (multi-value-repeated-key-literal) was the seed rule -- it flags duplicate
# keys in a dict literal, which hit TOPIC_ROUTING in
# events/subscribers/telegram_notifier.py twice:
#   - 2026-04-26: 'agent_failure_cluster' declared twice with DIVERGENT values
#     ('watchdog_alerts' vs 'critic_proposals') -> silent live misrouting
#   - 2026-05-29: 'watchdog_burst' declared twice with identical values -> latent
#     footgun
# The rest of the F group was cleared and switched on afterwards (May 2026), and
# then fell out of main during the v0.15.1 cutover -- silently, with no named
# revert.  This is the re-land.  See the design doc for why the archive branch
# main-pre-0.15.1-cutover is a decision record and not a patch source.
#
# PLW1514 (unspecified-encoding): bare open()/read_text()/write_text() in text
# mode defaults to the system locale encoding on Windows (cp1252 on US-locale
# installs), which silently corrupts any non-ASCII file content.  Three separate
# Windows sandbox regressions in one debug session before this went in.
select = ["F", "PLW1514"]

[lint.per-file-ignores]
# PERMANENT exemptions.  These are NOT backlog -- they are standing decisions.
#
# The F-group sunset list that used to sit below this block is GONE: stages 2-5
# burned it down from 544 entries to zero (2026-08-17) and stage 6 deleted the
# block.  Every F rule is clean tree-wide and gated in EVERY file, so a new F
# finding is a hard failure repo-wide.
#
# Do NOT add an F code to this table to unblock a commit -- fix the finding.
# There is exactly ONE standing F exemption, added in the 0.21.1 upstream merge:
# F821 for the tui_gateway modules that upstream installs by rebinding them onto
# server.py's globals, where the finding is false rather than outstanding. It is
# described at the entries themselves. tests/test_lint_config.py allows that one
# case, pinned to the rebinding contract, and still fails every other F exemption.
#
# Tests can intentionally exercise locale-encoding edge cases.
"tests/**" = ["PLW1514"]
# Skills and plugins are partially user-authored -- their own conventions.
"skills/**" = ["PLW1514"]
"optional-skills/**" = ["PLW1514"]
"plugins/**" = ["PLW1514"]

# ---------------------------------------------------------------------------
# tui_gateway: modules whose bodies are REBOUND onto server.py's globals.
#
# Upstream split server.py across these 34 modules and installs them with
# `for _m in (...): _m.register(sys.modules[__name__])` at the foot of server.py,
# which runs method_ctx.bind_module: every function is rebound so that its globals
# ARE server.py's. The modules therefore reference server.py's names bare, by
# design, and say so in their own docstrings. Pyflakes resolves names lexically
# and cannot see the rebinding, so each of those references is a false F821.
#
# This is NOT the sunset list returning. That list was backlog -- files that
# offended and were then fixed, 544 down to zero. These findings are WRONG rather
# than deferred: there is nothing to fix short of undoing upstream's split. They
# are permanent standing decisions, like the PLW1514 entries above.
#
# F821 ONLY, and named files only. The rest of the F group stays live here and is
# earning its keep -- F811 caught two duplicated imports in compute_host.py in the
# 0.21.1 merge, and they were fixed, not listed. method_ctx.py and every other module
# in the package keep full enforcement.
#
# server.py is listed too, as the loop's HOST rather than one of its members: it calls
# the names bind_module publishes onto it, so the same false F821 applies from the other
# side. It is still F821-only.
#
# The set below is exactly the install loop's membership; tests/test_lint_config.py
# asserts that, so an entry for a module that is not rebound will fail CI.
# The HOST of the loop, not a member of it. bind_module does ``g = vars(server)`` and writes
# every split module's functions there, so server.py's own calls to those names resolve at
# runtime — after the loop at the foot of the file — and Pyflakes reports each as F821. Checked
# by importing tui_gateway.server (which runs the loop) and hasattr-ing all 39 distinct names:
# every one is published. Same false finding, same F821-only scope.
"tui_gateway/server.py" = ["F821"]
"tui_gateway/agent_callbacks.py" = ["F821"]
"tui_gateway/change_watcher.py" = ["F821"]
"tui_gateway/compute_host_bridge.py" = ["F821"]
"tui_gateway/methods_bot_relay.py" = ["F821"]
"tui_gateway/methods_browser.py" = ["F821"]
"tui_gateway/methods_browser_control.py" = ["F821"]
"tui_gateway/methods_complete.py" = ["F821"]
"tui_gateway/methods_complete_helpers.py" = ["F821"]
"tui_gateway/methods_config.py" = ["F821"]
"tui_gateway/methods_config_set.py" = ["F821"]
"tui_gateway/methods_groups.py" = ["F821"]
"tui_gateway/methods_images.py" = ["F821"]
"tui_gateway/methods_profiles.py" = ["F821"]
"tui_gateway/methods_projects.py" = ["F821"]
"tui_gateway/methods_prompt.py" = ["F821"]
"tui_gateway/methods_session.py" = ["F821"]
"tui_gateway/methods_session_control.py" = ["F821"]
"tui_gateway/methods_session_foreign.py" = ["F821"]
