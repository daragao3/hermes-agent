name: Install & Update E2E (scheduler)

# The clock for install-e2e.yml on this fork. It does nothing but dispatch
# that workflow, because a direct `schedule:` trigger on install-e2e.yml
# failed at startup -- 0 jobs, 0s, and only GitHub's generic "An unexpected
# error has occurred" annotation, with the run named after the file path
# because the workflow was never evaluated. It hit roughly half the fork's
# scheduled fires from 2026-09-16 and every one from 2026-09-23 12:51Z
# (runs 35863108755, 35927884550, 36001281162, 36068039478), on commits
# whose workflow files were byte-identical to ones that had just run.
# Manual dispatches of the same commits all started (16 of 16), and
# upstream's scheduled fires of the same workflow never hit it, so this
# routes the fork's clock through the path that works.
#
# The inputs reproduce the old scheduled run exactly: route=all runs every
# OS, and tag-count=2 matches the `inputs.tag-count || 2` fallback that a
# scheduled run used (the dispatch default is 3).

on:
  schedule:
    # Every 12 hours, off the hour to avoid the top-of-hour runner crunch.
    # If this never fires (no `schedule` runs listed for this workflow while
    # other schedules on the fork are firing), GitHub has not registered the
    # cron: commit any change to this file on the default branch to make it
    # re-read the schedule. That happened after this file was first added
    # (no fire at 2026-09-25 07:20 or 19:20 UTC).
    - cron: '20 7,19 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    name: Dispatch install-e2e
    # Upstream schedules install-e2e.yml directly and never needed this.
    if: github.repository_owner != 'NousResearch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        # A paused target is a decision, not a fault. When install-e2e.yml
        # is disabled (Actions UI "Disable workflow", or `gh workflow
        # disable`), `gh workflow run` gets HTTP 422 "Cannot trigger a
        # 'workflow_dispatch' on a disabled workflow" and this clock went
        # red every 12 hours until someone noticed (2026-09-29, run
        # 36642609692, disabled by hand ~90 min before the fire). So read
        # the target's state first and skip green, loudly, when it is not
        # active -- the pause stays visible as a warning on every fire
        # without turning a deliberate pause into a failing schedule.
        run: |
          state=$(gh api "repos/$REPO/actions/workflows/install-e2e.yml" --jq .state)
          if [ "$state" != "active" ]; then
            echo "::warning title=install-e2e not dispatched::install-e2e.yml is '$state' on $REPO. Re-enable it to resume the scheduled runs: gh workflow enable install-e2e.yml --repo $REPO"
            echo "install-e2e.yml is **$state** on \`$REPO\`; nothing dispatched. Re-enable with \`gh workflow enable install-e2e.yml --repo $REPO\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh workflow run install-e2e.yml --repo "$REPO" --ref "$REF" -f route=all -f tag-count=2
