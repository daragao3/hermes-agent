name: Docs Site Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # zh-Hans locale parity. Its own job: it needs only Python, so it reports in
  # ~10s instead of waiting behind the npm install the site build needs.
  #
  # Runs against the checkout as committed, BEFORE generate-skill-docs.py
  # regenerates the English skill pages — the committed tree is what we are
  # gating.
  #
  # The dirty-tree gate that asserts the committed generated pages match what
  # generate-skill-docs.py would write lives in the docs-site-checks job below,
  # NOT here — it needs a tree the generator has already been re-run over,
  # which is the opposite of what this job needs. skills-index-freshness.yml
  # does NOT assert it either, whatever its name suggests: that workflow curls
  # the LIVE skills-index.json every 4h and opens an issue if it is stale, and
  # compares no trees at all. This comment claimed it did until 3d936c5062.
  i18n-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      # --allow-untranslated: generate-skill-docs.py emits ENGLISH pages only,
      # so adding a skill creates a page with no zh counterpart and would block
      # a PR on a translation its author cannot write. Those findings are still
      # printed (as a ::warning::) and the nightly run does fail on them. The
      # flag waives gate 1 (PAGE SET) and nothing else, so EVERY OTHER gate in
      # check-i18n-parity.py stays blocking here — they only ever fire on a page
      # somebody already translated, which is the drift this exists to stop.
      #
      # Deliberately no count: this comment said "the other three gates" and was
      # already wrong (gate 5 had landed in ee1fec2de2); it was corrected to
      # "four" and gate 6 landed the same day. Read the numbered gates in the
      # script's docstring — do not re-add a number here.
      - name: Check zh-Hans docs parity
        run: python3 website/scripts/check-i18n-parity.py --allow-untranslated

  # Generated per-skill pages whose source skill is gone. Its own python-only
  # job for the same two reasons as i18n-parity: it reports in ~10s instead of
  # waiting behind npm install, and — the load-bearing one — it must see the
  # tree AS COMMITTED. The docs-site-checks job below regenerates the pages
  # before it builds, and generate-skill-docs.py now PRUNES, so running this
  # there would check a tree the regeneration had already repaired and could
  # never fail. The dirty-tree gate in that job is the complement, not a
  # replacement: it catches the un-regenerated commit, this catches the page
  # whose skill is gone. Do not merge the two — they need opposite trees.
  orphaned-skill-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Check for orphaned per-skill docs pages
        run: python3 website/scripts/check-orphaned-skill-pages.py

  docs-site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        uses: ./.github/actions/retry
        with:
          command: npm ci
          working-directory: website

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install ascii-guard
        uses: ./.github/actions/retry
        with:
          command: python -m pip install ascii-guard==2.3.0 pyyaml==6.0.3

      - name: Extract skill metadata for dashboard
        run: python3 website/scripts/extract-skills.py

      - name: Regenerate per-skill docs pages + catalogs
        run: python3 website/scripts/generate-skill-docs.py

      # DIRTY-TREE GATE. The step above just re-ran the generator; if the
      # committed pages were up to date, it rewrote them byte-for-byte and the
      # tree is still clean. Anything else means somebody edited a SKILL.md (or
      # the generator itself) and did not regenerate, so what CI builds is not
      # what the repository contains.
      #
      # This is the check that catches a defect living in the GENERATOR. Every
      # other docs gate here runs against the tree AS COMMITTED and is blind to
      # it by construction: a local `npm ci && npm run build` builds the clean
      # committed pages and is genuinely warning-free, while CI regenerates
      # first and builds something else. That asymmetry put 6 broken zh-Hans
      # links past a green local build.
      #
      # It also makes prune_orphaned_pages() self-enforcing. Pruning REPAIRS
      # the tree during this job; without a dirty-tree check the repair is
      # invisible and a stale page can sit in main indefinitely.
      #
      # BLOCKING, not a ::warning::. Measured at ed3bc2970b: regenerating in a
      # clean checkout leaves `git status --porcelain` EMPTY, so this wedges no
      # PR on day one. It was 179 files at 6c7a28ef90 and would have had to be
      # advisory then; the regeneration + zh translation sweep closed that, and
      # an advisory gate on zero drift is just a warning nobody reads.
      #
      # Scoped to the paths generate-skill-docs.py owns rather than the whole
      # tree, so an unrelated write by another build step cannot fail it. The
      # untracked check is separate because `git diff` does not see a brand-new
      # page for a brand-new skill -- the single most likely form of this drift.
      - name: Check the regenerated docs pages match what is committed
        run: |
          set -o pipefail
          GENERATED='website/docs/user-guide/skills website/docs/reference/skills-catalog.md website/docs/reference/optional-skills-catalog.md website/sidebars.ts'
          untracked=$(git ls-files --others --exclude-standard -- $GENERATED)
          if ! git diff --exit-code --stat -- $GENERATED || [ -n "$untracked" ]; then
            echo
            echo "::error::Committed generated docs pages do not match generate-skill-docs.py output."
            if [ -n "$untracked" ]; then
              echo "New pages the generator wrote that are not committed:"
              echo "$untracked" | sed 's/^/  /'
            fi
            echo
            echo "Run 'python3 website/scripts/generate-skill-docs.py' and commit the result."
            echo "NOTE: regenerating the English pages drifts the zh-Hans translations,"
            echo "which were translated from older English. check-i18n-parity.py's"
            echo "--allow-untranslated waives ONLY the page-set gate -- the structure,"
            echo "content-drift and anchor gates stay blocking. Landing a regeneration is"
            echo "a TRANSLATION SWEEP, not a one-command fix."
            git diff -- $GENERATED | head -200
            exit 1
          fi

      - name: Lint docs diagrams
        run: npm run lint:diagrams
        working-directory: website

      - name: Build Docusaurus
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/docusaurus-build.log"
        working-directory: website

      # The build's EXIT CODE proves nothing about references: docusaurus.config
      # sets onBrokenLinks and onBrokenMarkdownLinks to 'warn', so it exits 0
      # with broken links in the output. This is the only gate that catches a
      # wrongly-present /docs/ prefix — check-i18n-parity.py normalises that
      # prefix away by design and is blind to it. A 115-link regression reached
      # main past three green static gates and was caught only here.
      - name: Check the build log for broken links and anchors
        run: python3 website/scripts/check-build-links.py "$RUNNER_TEMP/docusaurus-build.log"
