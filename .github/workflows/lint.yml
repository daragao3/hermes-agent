name: Lint (ruff + ty)

# Two things here:
#   1. Advisory diff — ruff + ty diagnostics as a diff vs the target branch.
#      Posts a Markdown summary and a PR comment. Exit zero always.
#   2. Blocking ``ruff check .`` — enforces the rules selected in ``ruff.toml``
#      at the repo root (the Pyflakes ``F`` group, PLW1514 and async guards). Failure blocks
#      merge. Separate job so the advisory diff still runs and posts even when
#      enforcement fails.
#
#      The config is ``ruff.toml``, NOT pyproject.toml: ruff reads ruff.toml in
#      preference and ignores ``[tool.ruff]`` silently, so pyproject carries no
#      such table. ``ruff check .`` picks the right file up on its own.

on:
  workflow_call:
    inputs:
      event_name:
        description: The event name from the calling orchestrator (pull_request or push).
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-diff:
    name: ruff + ty diff
    if: inputs.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # need full history for merge-base + worktree

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pinned: unpinned setup-uv fetches a 'latest' manifest from
          # raw.githubusercontent.com every job; transient fetch failures
          # fail the job (2026-07-28 incident). Keep in sync with tests.yml.
          version: "0.9.28"

      - name: Install ruff + ty
        uses: ./.github/actions/retry
        with:
          # ruff is PINNED and must equal .pre-commit-config.yaml's
          # ruff-pre-commit rev, ruff.toml's `required-version` and pyproject's
          # dev extra -- see the ruff-blocking job below for why they all move
          # together, and tests/test_lint_config.py::TestRuffVersionPins, which
          # asserts it. ty is deliberately left floating: this job is advisory,
          # and ty has no second enforcer to disagree with.
          command: uv tool install ruff==0.15.12 && uv tool install ty

      - name: Determine base ref
        id: base
        run: |
          # For PRs, diff against the merge base with the target branch.
          # For pushes to main, diff against the previous commit on main.
          if [ "${{ inputs.event_name }}" = "pull_request" ]; then
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            BASE_REF="HEAD~1"
          fi
          echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "Base SHA: ${BASE_SHA}"
          echo "Base ref: ${BASE_REF}"

      - name: Run ruff + ty on HEAD
        run: |
          mkdir -p .lint-reports/head
          ruff check --output-format json --exit-zero \
            > .lint-reports/head/ruff.json || true
          ty check --output-format gitlab --exit-zero \
            > .lint-reports/head/ty.json || true
          echo "HEAD ruff: $(wc -c < .lint-reports/head/ruff.json) bytes"
          echo "HEAD ty:   $(wc -c < .lint-reports/head/ty.json) bytes"

      - name: Run ruff + ty on base (via git worktree)
        run: |
          mkdir -p .lint-reports/base
          # Use a worktree so we don't clobber the main checkout. If the basex
          # SHA is identical to HEAD (e.g. first commit), skip and leave the
          # base reports empty — the diff script handles missing files.
          HEAD_SHA=$(git rev-parse HEAD)
          BASE_SHA="${{ steps.base.outputs.sha }}"
          if [ "$BASE_SHA" = "$HEAD_SHA" ]; then
            echo "Base SHA == HEAD SHA, skipping base scan."
            echo '[]' > .lint-reports/base/ruff.json
            echo '[]' > .lint-reports/base/ty.json
          else
            git worktree add --detach /tmp/lint-base "$BASE_SHA"
            (
              cd /tmp/lint-base
              ruff check --output-format json --exit-zero \
                > "$GITHUB_WORKSPACE/.lint-reports/base/ruff.json" || true
              ty check --output-format gitlab --exit-zero \
                > "$GITHUB_WORKSPACE/.lint-reports/base/ty.json" || true
            )
            git worktree remove --force /tmp/lint-base
          fi
          echo "base ruff: $(wc -c < .lint-reports/base/ruff.json) bytes"
          echo "base ty:   $(wc -c < .lint-reports/base/ty.json) bytes"

      - name: Generate diff summary
        env:
          HEAD_REF: ${{ inputs.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          python scripts/lint_diff.py \
            --base-ruff .lint-reports/base/ruff.json \
            --head-ruff .lint-reports/head/ruff.json \
            --base-ty   .lint-reports/base/ty.json \
            --head-ty   .lint-reports/head/ty.json \
            --base-ref  "${{ steps.base.outputs.ref }}" \
            --head-ref  "$HEAD_REF" \
            --output    .lint-reports/summary.md
          cat .lint-reports/summary.md >> "$GITHUB_STEP_SUMMARY"

  ruff-blocking:
    # Enforce the rules selected in ruff.toml: the Pyflakes ``F`` group plus
    # PLW1514 (unspecified-encoding), which catches bare ``open()`` /
    # ``read_text()`` / ``write_text()`` calls that default to locale
    # encoding on Windows. The F group is enforced tree-wide with NO
    # suppressions -- the re-land sunset list was burned to zero and deleted
    # (2026-08-17), so any new F finding anywhere fails here. ruff.toml's
    # per-file-ignores now holds only PLW1514 exemptions for tests/, skills/,
    # optional-skills/ and plugins/.
    # Failure blocks merge; the advisory ``lint-diff`` job above runs
    # independently so reviewers still get the diff comment even when
    # enforcement fails.
    name: ruff enforcement (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pinned: unpinned setup-uv fetches a 'latest' manifest from
          # raw.githubusercontent.com every job; transient fetch failures
          # fail the job (2026-07-28 incident). Keep in sync with tests.yml.
          version: "0.9.28"

      - name: Install ruff
        uses: ./.github/actions/retry
        with:
          # PINNED, and the pin is load-bearing: several separate ruff binaries
          # enforce this one rule set -- this job, the pre-commit hook
          # (.pre-commit-config.yaml `rev:`), the repo .venv (pyproject's dev
          # extra), and whatever ruff is on PATH, which
          # events/producers/ruff_gate_probe.py shells out to every 15 minutes.
          # Unpinned, this job silently drifts to whatever ruff released today
          # and can disagree with the others about the same tree.
          #
          # This pin and ruff.toml's `required-version` are two independent
          # layers, and both are worth keeping: this one says which version to
          # FETCH, required-version says which version is allowed to RUN. If
          # this ever goes unpinned again, required-version turns the result
          # into a loud failure (exit 2, config refused) instead of a silent
          # lint with the wrong binary. Bump every site in one commit or not at
          # all; tests/test_lint_config.py::TestRuffVersionPins fails if this
          # pin and the hook rev diverge, or if this install goes unpinned.
          command: uv tool install ruff==0.15.12

      - name: ruff check .
        # No --exit-zero, no || true. Exit code propagates to the job,
        # which propagates to the required-check gate.
        run: |
          ruff check .

  windows-footguns:
    # Static guardrails on Windows-unsafe Python primitives — os.kill(pid, 0),
    # os.killpg, os.setsid, signal.SIGKILL without getattr fallback,
    # shebang scripts via subprocess, bare open() without encoding=, etc.
    # See scripts/check-windows-footguns.py for the full rule list.
    name: Windows footguns (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # Pinned: unpinned setup-uv fetches a 'latest' manifest from
          # raw.githubusercontent.com every job; transient fetch failures
          # fail the job (2026-07-28 incident). Keep in sync with tests.yml.
          version: "0.9.28"

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Run footgun checker
        run: python scripts/check-windows-footguns.py --all

      # The Sep 2026 decomposition kept old import paths alive for external plugins
      # (PLUGIN-COMPAT blocks, see COMPAT_MANIFEST.md). They are removed on schedule by
      # reverting one commit, so in-tree code must never depend on them.
      - name: Forbid in-tree use of plugin-compat pointers
        run: python scripts/check_compat_pointers.py

      # Advisory: dropped public names / methods / test defs vs the PR base, printed into the log.
      # A refactor that silently removes a public symbol breaks plugins that import it; the Sep 2026
      # decomposition opened with 1,703 such drops that reviewers had to find by hand.
      # Advisory: it never fails the job. The checkout above is depth-1, so deepen both sides until
      # a merge-base exists (the script refuses to report a clean diff without one, by design).
      - name: Public-surface diff vs base (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch --no-tags --deepen=200 origin "${{ github.base_ref }}" HEAD
          for i in 1 2 3; do
            git merge-base "origin/${{ github.base_ref }}" HEAD >/dev/null 2>&1 && break
            git fetch --no-tags --deepen=1000 origin "${{ github.base_ref }}" HEAD
          done
          python scripts/ci/check_public_surface.py --base "origin/${{ github.base_ref }}" --head HEAD
